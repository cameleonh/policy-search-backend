name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  docs:
    name: Docs check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify PRD and issue plan exist
        run: |
          test -f tasks/prd-policy-search-platform.md
          test -f tasks/github-issue-plan.md

  python:
    name: Python lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync
      - name: Lint (ruff)
        run: uv run ruff check .
      - name: Format check (ruff)
        run: uv run ruff format --check .
      - name: Typecheck (mypy)
        run: uv run mypy .
      - name: Test (pytest)
        run: uv run pytest
      - name: API import smoke
        run: uv run python -c "from apps.api.main import app; print(app.title)"

  typescript:
    name: TypeScript lint, typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm run lint:ts
      - name: Typecheck
        run: pnpm run typecheck:ts

  build:
    name: Production build + tests
    runs-on: ubuntu-latest
    needs: [python, typescript]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      - name: Install Python dependencies
        run: uv sync
      - name: Install TypeScript dependencies
        run: pnpm install --frozen-lockfile
      - name: TypeScript tests (vitest)
        run: pnpm run test:ts
      - name: Next.js production build
        run: pnpm --filter @policy-search/web build

  migrations:
    name: PostgreSQL migration tests
    runs-on: ubuntu-latest
    needs: [python]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: policy
          POSTGRES_PASSWORD: policy
          POSTGRES_DB: policy_search
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U policy"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://policy:policy@localhost:5432/policy_search
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync
      - name: Apply migrations
        run: uv run alembic upgrade head
      - name: Re-run migrations (idempotency)
        run: uv run alembic upgrade head
      - name: Run migration tests
        run: uv run pytest db/tests/ -v
