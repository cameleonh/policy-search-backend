[project]
name = "policy-search-backend"
version = "0.0.0"
description = "Youth and small-business unified policy search platform"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "asyncpg>=0.30",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[tool.uv.workspace]
members = [
    "apps/api",
    "workers/ingest",
    "workers/normalize",
    "packages/contracts-py",
]

[tool.uv.sources]
apps-api = { workspace = true }
workers-ingest = { workspace = true }
workers-normalize = { workspace = true }

# ── Ruff ──────────────────────────────────────
[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

# ── Mypy ──────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
mypy_path = ".,packages/contracts-py"
explicit_package_bases = true
exclude = ["tasks/", "scripts/"]

# ── Pytest ────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["apps", "workers", "packages", "db"]
pythonpath = [".", "packages/contracts-py"]
python_files = ["test_*.py", "*_test.py"]
asyncio_mode = "auto"
